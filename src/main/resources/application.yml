spring:
  application:
    name: spei-in-api
  datasource:
    url: jdbc:h2:file:./data/spei;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:https://auth.lab.dnu.mx/realms/fineract_keycloak}

server:
  port: ${SERVER_PORT:8080}

fineract:
  base-url: ${FINERACT_BASE_URL:https://fineract.lab.dnu.mx/fineract-provider/api/v1}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
  tenant-id: ${FINERACT_TENANT_ID:default}
  payment-type-id: ${FINERACT_PAYMENT_TYPE_ID:3}

spei:
  spread: ${SPEI_SPREAD:0.005}
  commission: ${SPEI_COMMISSION:8.00}
